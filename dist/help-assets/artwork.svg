<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc"><title id="title">From a record to its artwork</title><desc id="desc">1. Select a record: Its portrait appears beside the table. 2. Browse related artwork: Open the images linked to this record. 3. Download image preview: Save a picture from its detail window</desc><rect width="1040" height="400" rx="18" fill="#101d2e"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#f6c85f">GUARDIAN ATLAS · ILLUSTRATED GUIDE</text><text x="32" y="88" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#edf3fa">From a record to its artwork</text><rect x="30" y="126" width="980" height="70" rx="10" fill="#192a40" stroke="#34506c"/><circle cx="64" cy="161" r="18" fill="#f6c85f"/><text x="64" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#101d2e">1</text><text x="103" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#edf3fa">Select a record</text><text x="103" y="179" font-family="Arial,sans-serif" font-size="16" fill="#b6c9dd">Its portrait appears beside the table</text><rect x="30" y="210" width="980" height="70" rx="10" fill="#192a40" stroke="#34506c"/><circle cx="64" cy="245" r="18" fill="#f6c85f"/><text x="64" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#101d2e">2</text><text x="103" y="239" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#edf3fa">Browse related artwork</text><text x="103" y="263" font-family="Arial,sans-serif" font-size="16" fill="#b6c9dd">Open the images linked to this record</text><rect x="30" y="294" width="980" height="70" rx="10" fill="#192a40" stroke="#34506c"/><circle cx="64" cy="329" r="18" fill="#f6c85f"/><text x="64" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#101d2e">3</text><text x="103" y="323" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#edf3fa">Download image preview</text><text x="103" y="347" font-family="Arial,sans-serif" font-size="16" fill="#b6c9dd">Save a picture from its detail window</text></svg>